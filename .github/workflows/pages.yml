name: Deploy PortalDB to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild Breda portrait asset
        run: |
          mkdir -p assets/npcs
          cat npc-art-data/breda/*.b64 | tr -d '\n\r ' | base64 --decode > assets/npcs/breda.webp
          test -s assets/npcs/breda.webp
          test "$(wc -c < assets/npcs/breda.webp)" -gt 30000
          test "$(head -c 4 assets/npcs/breda.webp)" = "RIFF"
          test "$(dd if=assets/npcs/breda.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"
      - name: Validate Arlette portrait asset
        run: |
          test -s assets/npcs/arlette.webp
          test "$(head -c 4 assets/npcs/arlette.webp)" = "RIFF"
          test "$(dd if=assets/npcs/arlette.webp bs=1 skip=8 count=4 2>/dev/null)" = "WEBP"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

